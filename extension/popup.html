<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keeva Vault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body { width: 360px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .btn { @apply px-4 py-2 rounded-xl font-semibold text-sm transition-all active:scale-95; }
    .btn-primary { @apply bg-gradient-to-r from-cyan-500 via-indigo-600 to-purple-600 text-white; }
    .btn-secondary { @apply bg-slate-800 text-slate-200 border border-slate-700 hover:bg-slate-700; }
    .btn-danger { @apply bg-rose-500/20 text-rose-300 border border-rose-500/30 hover:bg-rose-500/30; }
    .input { @apply w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500; }
    .card { @apply bg-slate-900/80 border border-slate-800 rounded-2xl p-4; }
    .badge { @apply inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-mono; }
    .badge-cyan { @apply bg-cyan-500/15 text-cyan-300 border border-cyan-500/20; }
    .badge-amber { @apply bg-amber-500/15 text-amber-300 border border-amber-500/20; }
    .badge-rose { @apply bg-rose-500/15 text-rose-300 border border-rose-500/20; }
    .badge-emerald { @apply bg-emerald-500/15 text-emerald-300 border border-emerald-500/20; }
    .skeleton { @apply animate-pulse bg-slate-800 rounded; }
  </style>
</head>
<body class="bg-[#06070B] text-slate-100 p-4">
  <div id="app">
    <!-- Header -->
    <div class="flex items-center gap-3 mb-4">
      <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-cyan-400 via-indigo-500 to-fuchsia-600 p-[1.5px]">
        <div class="w-full h-full bg-[#06070B] rounded-[14px] flex items-center justify-center">
          <svg viewBox="0 0 120 100" width="22" height="22" fill="none">
            <defs><linearGradient id="pg1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stopColor="#00E5FF"/><stop offset="50%" stopColor="#6366F1"/><stop offset="100%" stopColor="#D946EF"/>
            </linearGradient></defs>
            {/* K */}
            <path d="M18 25 L18 75 M18 50 L35 25 M18 50 L35 75" stroke="url(#pg1)" strokeWidth="11" strokeLinecap="round"/>
            {/* E */}
            <path d="M45 25 L60 25 M45 50 L58 50 M45 75 L60 75 M45 25 L45 75" stroke="url(#pg1)" strokeWidth="11" strokeLinecap="round"/>
            {/* E */}
            <path d="M70 25 L85 25 M70 50 L83 50 M70 75 L85 75 M70 25 L70 75" stroke="url(#pg1)" strokeWidth="11" strokeLinecap="round"/>
            {/* V */}
            <path d="M90 25 L96 75 L102 25" stroke="url(#pg1)" strokeWidth="11" strokeLinecap="round" strokeLinejoin="round"/>
            {/* A */}
            <path d="M108 75 L115 25 L122 75 M110 50 L120 50" stroke="url(#pg1)" strokeWidth="11" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </div>
      </div>
      <div>
        <h1 class="text-lg font-black text-white">Keeva</h1>
        <p class="text-[10px] text-slate-400 font-mono">Save to Vault</p>
      </div>
    </div>

    <!-- Auth Status -->
    <div id="authSection" class="card mb-4">
      <div id="unauthenticated" class="hidden">
        <p class="text-sm text-slate-400 mb-3">Connect your Keeva account to save content</p>
        <button id="loginBtn" class="btn btn-primary w-full">Login / Signup</button>
        <p class="text-[11px] text-slate-500 mt-2 text-center">Opens Keeva in new tab</p>
      </div>
      <div id="authenticated" class="hidden">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <div id="avatar" class="w-7 h-7 rounded-lg bg-gradient-to-br from-cyan-500 to-indigo-600 flex items-center justify-center text-white text-xs font-black"></div>
            <div>
              <p id="userEmail" class="text-sm font-semibold text-white"></p>
              <p class="text-[10px] text-emerald-400 font-mono">● Connected</p>
            </div>
          </div>
          <button id="logoutBtn" class="btn btn-secondary text-[10px] px-2 py-1">Logout</button>
        </div>
      </div>
    </div>

    <!-- Current Page Info -->
    <div id="pageInfo" class="card mb-4 hidden">
      <div class="flex items-start gap-3">
        <div id="pageThumb" class="w-16 h-16 rounded-xl bg-slate-800 flex-shrink-0 relative overflow-hidden">
          <img id="thumbImg" src="" alt="" class="w-full h-full object-cover hidden">
          <div id="thumbFallback" class="w-full h-full flex items-center justify-center">
            <svg class="w-6 h-6 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          </div>
        </div>
        <div class="flex-1 min-w-0">
          <p id="pageTitle" class="text-sm font-semibold text-white truncate"></p>
          <p id="pagePlatform" class="text-[10px] text-slate-400 font-mono"></p>
          <div id="pageTags" class="flex flex-wrap gap-1 mt-2"></div>
        </div>
      </div>
    </div>

    <!-- Video Detected Section -->
    <div id="videoSection" class="card mb-4 hidden">
      <div class="flex items-center gap-2 text-xs font-semibold text-cyan-400 mb-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>Video Detected</span>
      </div>
      <div class="space-y-2">
        <button id="saveVideoBtn" class="btn btn-primary w-full flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          Save Video to Vault
        </button>
        <button id="getTranscriptBtn" class="btn btn-secondary w-full flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          Get Transcript (AI)
        </button>
      </div>
      <p id="transcriptStatus" class="text-[10px] text-slate-500 text-center hidden"></p>
    </div>

    <!-- Quick Save Current Page -->
    <div id="quickSaveSection" class="card mb-4 hidden">
      <p class="text-sm text-slate-300 mb-3">Save this page to your vault</p>
      <input type="text" id="customTitle" class="input mb-3" placeholder="Custom title (optional)">
      <div class="flex gap-2">
        <button id="savePageBtn" class="btn btn-primary flex-1">Save Page</button>
        <button id="saveAsPdfBtn" class="btn btn-secondary">Save as PDF</button>
      </div>
    </div>

    <!-- Settings -->
    <div class="card">
      <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Settings</p>
      <div class="space-y-2">
        <label class="flex items-center justify-between cursor-pointer">
          <span class="text-sm text-slate-300">Auto-detect videos</span>
          <input type="checkbox" id="autoDetect" class="w-5 h-5 accent-cyan-500 rounded border-slate-700 bg-slate-800" checked>
        </label>
        <label class="flex items-center justify-between cursor-pointer">
          <span class="text-sm text-slate-300">Show notifications</span>
          <input type="checkbox" id="showNotifs" class="w-5 h-5 accent-cyan-500 rounded border-slate-700 bg-slate-800" checked>
        </label>
        <div class="pt-2 border-t border-slate-800">
          <label class="block text-[10px] text-slate-500 mb-1">API Base URL</label>
          <input type="text" id="apiBase" class="input text-[11px]" placeholder="http://localhost:3000">
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="mt-4 pt-3 border-t border-slate-800 flex items-center justify-between text-[10px] text-slate-500 font-mono">
      <span>v1.0.0</span>
      <a href="https://github.com/yourusername/keevo" target="_blank" class="text-cyan-400 hover:text-cyan-300">Docs</a>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
