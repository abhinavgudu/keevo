<svg viewBox="0 0 512 512" width="512" height="512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06070B" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Ultra 3D Gradient 1 (Cyan to Indigo) -->
    <linearGradient id="kGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="45%" stop-color="#06B6D4"/>
      <stop offset="85%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Metallic Edge Highlight -->
    <linearGradient id="kMetal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E879F9" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Keyhole Core Glow -->
    <linearGradient id="keyGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Base Circle with Glow -->
  <rect width="512" height="512" rx="128" fill="#06070B"/>
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)"/>

  <!-- Outer Glass Diamond Frame -->
  <g filter="url(#neonGlow)">
    <!-- Vertical Pillar of K -->
    <rect x="136" y="112" width="60" height="288" rx="18" fill="url(#kGrad1)"/>
    <rect x="136" y="112" width="60" height="288" rx="18" stroke="url(#kMetal)" stroke-width="3" fill="none" opacity="0.8"/>

    <!-- Upper Arm of K -->
    <path d="M196 256 L344 118 C352 110 366 110 374 118 L386 130 C394 138 394 152 386 160 L260 276 Z" fill="url(#kGrad1)"/>
    <path d="M196 256 L344 118 C352 110 366 110 374 118 L386 130 C394 138 394 152 386 160 L260 276 Z" stroke="url(#kMetal)" stroke-width="3" fill="none" opacity="0.8"/>

    <!-- Lower Arm of K -->
    <path d="M244 260 L382 386 C390 394 390 408 382 416 L370 428 C362 436 348 436 340 428 L196 296 Z" fill="url(#kGrad1)"/>
    <path d="M244 260 L382 386 C390 394 390 408 382 416 L370 428 C362 436 348 436 340 428 L196 296 Z" stroke="url(#kMetal)" stroke-width="3" fill="none" opacity="0.8"/>
  </g>

  <!-- Central Vault Keyhole Orbital Emblem -->
  <g transform="translate(256, 256)">
    <!-- Orbit Rings -->
    <circle r="68" stroke="#00F0FF" stroke-width="3" stroke-dasharray="8 6" opacity="0.75"/>
    <circle r="84" stroke="#A855F7" stroke-width="2" stroke-dasharray="16 10" opacity="0.5"/>
    
    <!-- Keyhole Container -->
    <circle r="44" fill="#06070B" stroke="url(#kMetal)" stroke-width="3"/>
    <circle r="40" fill="url(#kGrad1)" opacity="0.3"/>

    <!-- Keyhole Shape -->
    <path d="M0 -18 C-10 -18 -18 -10 -18 0 C-18 6 -13 11 -8 14 L-10 24 C-11 27 -8 30 -5 30 L5 30 C8 30 11 27 10 24 L8 14 C13 11 18 6 18 0 C18 -10 10 -18 0 -18 Z" fill="url(#keyGlow)"/>
    
    <!-- Sparkle Accents -->
    <circle cx="-136" cy="-136" r="6" fill="#00F0FF"/>
    <circle cx="120" cy="130" r="5" fill="#E879F9"/>
  </g>
</svg>