<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="30%" stop-color="#06B6D4"/>
      <stop offset="60%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer glow ring -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="url(#logoGrad)" stroke-width="2" opacity="0.4"/>
  
  <!-- Main background -->
  <rect x="12" y="12" width="96" height="96" rx="24" fill="url(#glowGrad)" filter="url(#innerGlow)"/>
  <rect x="12" y="12" width="96" height="96" rx="24" fill="none" stroke="url(#logoGrad)" stroke-width="1.5"/>
  
  <!-- KEEVA lettermark - modern geometric -->
  <g transform="translate(60, 60)">
    <!-- K -->
    <path d="M-32 -22 L-32 22 M-32 0 L-18 -22 M-32 0 L-18 22" 
          stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- E -->
    <path d="M-8 -22 L4 -22 M-8 0 L0 0 M-8 22 L4 22 M-8 -22 L-8 22" 
          stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- E -->
    <path d="M12 -22 L24 -22 M12 0 L18 0 M12 22 L24 22 M12 -22 L12 22" 
          stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- V -->
    <path d="M30 -22 L36 22 L42 -22" 
          stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- A -->
    <path d="M48 22 L54 -22 L60 22 M51 0 L57 0" 
          stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Subtle accent dots -->
  <circle cx="18" cy="18" r="2" fill="#00E5FF" opacity="0.6"/>
  <circle cx="102" cy="102" r="2" fill="#A855F7" opacity="0.6"/>
</svg>