<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="kuraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#7F00FF"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#7F00FF"/>
    </linearGradient>
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Background with Rounded Squircle -->
  <rect width="512" height="512" rx="140" fill="#06070B"/>
  <rect x="12" y="12" width="488" height="488" rx="128" fill="none" stroke="url(#kuraGlow)" stroke-width="4" opacity="0.35"/>

  <!-- Iconic 9:16 Curation Portal & Infinity Spark Symbol -->
  <g filter="url(#neonBlur)">
    <!-- 9:16 Vertical Reel Frame Geometry -->
    <rect x="146" y="96" width="220" height="320" rx="36" fill="none" stroke="url(#kuraGlow)" stroke-width="16"/>
    
    <!-- Central Prism / Curation Core -->
    <path d="M256 160 L320 256 L256 352 L192 256 Z" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linejoin="round"/>
    
    <!-- Play Pulse Center -->
    <circle cx="256" cy="256" r="24" fill="url(#kuraGlow)"/>
    <polygon points="252,246 266,256 252,266" fill="#06070B"/>

    <!-- Subtle Optical Flare Accents -->
    <circle cx="170" cy="120" r="6" fill="#00F2FE"/>
    <circle cx="342" cy="120" r="6" fill="#7F00FF"/>
    <circle cx="256" cy="390" r="5" fill="#4FACFE"/>
  </g>
</svg>
